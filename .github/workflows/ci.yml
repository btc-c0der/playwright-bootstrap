name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # Verifies create-qaf actually produces a valid, non-empty scaffold — this
  # is the monorepo's own integration smoke test, distinct from the generated
  # repo's own CI (template/.github/workflows), which teams get once scaffolded.
  smoke-scaffold:
    runs-on: ubuntu-latest
    needs: build-lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Scaffold a throwaway project
        run: |
          node packages/create-qaf/dist/index.js smoke-test-app \
            --yes --no-install --no-git \
            --org smoke-org --base-url http://localhost:4319 --projects web,api,mobile --pm pnpm
      - name: Assert expected files exist
        run: |
          test -f smoke-test-app/package.json
          test -f smoke-test-app/playwright.config.ts
          test -f smoke-test-app/quarantine-manifest.json
          test -d smoke-test-app/.claude/skills
          test -d smoke-test-app/tests/web
          test -d smoke-test-app/tests/api
          test -d smoke-test-app/tests/mobile
          ! grep -r "{{" smoke-test-app --include="*.ts" --include="*.json" --include="*.md" -l || (echo "unreplaced template tokens found" && exit 1)
